<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ChromePass</title>
  <style>:root {
  --bg:       #1e1e2e;
  --surface:  #181825;
  --overlay:  #313244;
  --text:     #cdd6f4;
  --subtext:  #a6adc8;
  --muted:    #6c7086;
  --blue:     #89b4fa;
  --green:    #a6e3a1;
  --red:      #f38ba8;
  --yellow:   #f9e2af;
  --teal:     #94e2d5;
  --mauve:    #cba6f7;
  --border:   #45475a;
  --radius:   10px;
  --radius-sm: 6px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  width: 380px;
  min-height: 200px;
  max-height: 580px;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  font-size: 13px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.hidden { display: none !important; }

/* ── HEADER ── */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px 10px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.header-brand { display: flex; align-items: center; gap: 8px; }
.logo { font-size: 18px; }
.name { font-weight: 700; font-size: 15px; color: var(--blue); }
.header-actions { display: flex; gap: 4px; }

.icon-btn {
  background: none; border: none; cursor: pointer;
  color: var(--subtext); font-size: 15px; padding: 4px 6px;
  border-radius: var(--radius-sm);
  transition: color 0.15s, background 0.15s;
}
.icon-btn:hover { color: var(--text); background: var(--overlay); }

/* ── AUTH ── */
.auth-body {
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.auth-sub {
  font-size: 12px;
  color: var(--subtext);
}

/* ── FORMS ── */
.form-group { display: flex; flex-direction: column; gap: 5px; }

.form-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--subtext);
  text-transform: uppercase;
  letter-spacing: 0.4px;
}

.form-input {
  width: 100%;
  background: var(--overlay);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 8px 10px;
  color: var(--text);
  font-size: 13px;
  outline: none;
  transition: border-color 0.15s;
}
.form-input:focus { border-color: var(--blue); }
.form-input::placeholder { color: var(--muted); }
.form-input[type="password"] { font-family: monospace; letter-spacing: 2px; font-size: 14px; }
.form-input[type="password"]::placeholder { font-family: -apple-system, sans-serif; letter-spacing: 0; font-size: 13px; }

/* ── BUTTONS ── */
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: 6px; padding: 8px 14px; border-radius: var(--radius-sm);
  font-size: 13px; font-weight: 600; cursor: pointer; border: none;
  transition: opacity 0.15s, transform 0.1s;
}
.btn:hover  { opacity: 0.88; }
.btn:active { transform: scale(0.97); }
.btn-primary { background: var(--blue); color: #1e1e2e; }
.btn-full    { width: 100%; }

/* ── ERROR ── */
.error-msg {
  font-size: 12px;
  color: var(--red);
  background: rgba(243,139,168,0.12);
  border: 1px solid rgba(243,139,168,0.3);
  border-radius: var(--radius-sm);
  padding: 7px 10px;
}

/* ── CONTENT (unlocked) ── */
.content {
  flex: 1;
  overflow-y: auto;
  padding: 12px;
  max-height: 400px;
}
.content::-webkit-scrollbar { width: 4px; }
.content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.site-label {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  color: var(--muted);
  margin-bottom: 8px;
}

/* ── CREDENTIAL CARDS ── */
.cred-card {
  background: var(--overlay);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px 12px;
  margin-bottom: 6px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 10px;
  transition: border-color 0.15s, background 0.15s;
}
.cred-card:hover { border-color: var(--blue); background: #363648; }

.cred-favicon {
  width: 28px; height: 28px;
  background: var(--surface);
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 700; color: var(--blue);
  flex-shrink: 0; overflow: hidden;
}
.cred-favicon img { width: 100%; height: 100%; object-fit: contain; }

.cred-info { flex: 1; min-width: 0; }
.cred-title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cred-user  { font-size: 11px; color: var(--subtext); font-family: monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }

.fill-hint { font-size: 11px; color: var(--blue); opacity: 0; transition: opacity 0.15s; white-space: nowrap; }
.cred-card:hover .fill-hint { opacity: 1; }

.empty-state { text-align: center; padding: 28px 12px; color: var(--muted); }
.empty-icon  { font-size: 28px; margin-bottom: 8px; }
.empty-state p { font-size: 12px; }
</style>
</head>
<body>
<div id="app">

  <!-- SETUP -->
  <div id="state-setup" class="state hidden">
    <div class="header">
      <div class="header-brand"><span class="logo">🔐</span><span class="name">ChromePass</span></div>
    </div>
    <div class="auth-body">
      <p class="auth-sub">Create your master password to get started</p>
      <div class="form-group">
        <label class="form-label">Master Password</label>
        <input type="password" class="form-input" id="setup-password" placeholder="Min 8 characters" autocomplete="new-password">
      </div>
      <div class="form-group">
        <label class="form-label">Confirm Password</label>
        <input type="password" class="form-input" id="setup-confirm" placeholder="Repeat password" autocomplete="new-password">
      </div>
      <div class="error-msg hidden" id="setup-error"></div>
      <button class="btn btn-primary btn-full" id="setup-btn">Create Vault</button>
    </div>
  </div>

  <!-- LOGIN -->
  <div id="state-login" class="state hidden">
    <div class="header">
      <div class="header-brand"><span class="logo">🔐</span><span class="name">ChromePass</span></div>
    </div>
    <div class="auth-body">
      <p class="auth-sub">Enter your master password to unlock</p>
      <div class="form-group">
        <input type="password" class="form-input" id="login-password" placeholder="Master password" autocomplete="current-password">
      </div>
      <div class="error-msg hidden" id="login-error"></div>
      <button class="btn btn-primary btn-full" id="login-btn">Unlock</button>
    </div>
  </div>

  <!-- UNLOCKED -->
  <div id="state-unlocked" class="state hidden">
    <div class="header">
      <div class="header-brand"><span class="logo">🔐</span><span class="name">ChromePass</span></div>
      <div class="header-actions">
        <button class="icon-btn" id="lock-btn" title="Lock vault">🔒</button>
        <button class="icon-btn" id="open-vault-btn" title="Open full vault">↗️</button>
      </div>
    </div>
    <div class="content">
      <div class="site-label" id="site-label">This site</div>
      <div id="site-credentials"></div>
    </div>
  </div>

</div>
<script src="popup.js"></script>
</body>
</html>
